<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="About me: I&#x27;m a Python developer interested in dependable backend services, API development, web applications, and cybersecurity. I enjoy turning practical problems into working software and continuously improving my development skills.">
<title>About Me</title>
<defs>
  <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1d0c14"/><stop offset="0.6" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
  </linearGradient>
  <linearGradient id="ab-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D"/><stop offset="0.5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/>
  </linearGradient>
  <linearGradient id="ab-scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.09"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ab-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B" stop-opacity="0.8"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
  </linearGradient>
  <pattern id="ab-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.06" stroke-width="1"/>
  </pattern>
  <clipPath id="ab-clip"><rect x="1" y="1" width="1198" height="248" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="248" rx="18" fill="url(#ab-bg)" stroke="#451126" stroke-width="2"/>
<g clip-path="url(#ab-clip)">
  <rect x="1" y="1" width="1198" height="248" fill="url(#ab-grid)"/>
  <rect x="-300" y="0" width="300" height="250" fill="url(#ab-scan)">
    <animate attributeName="x" values="-300;1300" dur="9s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="1" y="1" width="1198" height="248" rx="18" fill="none" stroke="url(#ab-edge)" stroke-width="2.5"
      pathLength="100" stroke-dasharray="14 86" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="8s" repeatCount="indefinite"/>
</rect>
<circle cx="44" cy="44" r="4" fill="#E5B5C7">
  <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/>
</circle>
<text x="60" y="49" fill="#C77B9B" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="3">01 / ABOUT ME</text>
<rect x="226" y="43" width="864" height="2" fill="url(#ab-rule)">
  <animate attributeName="opacity" values="0.35;1;0.35" dur="5s" repeatCount="indefinite"/>
</rect>
<g transform="translate(1136 44)" fill="none" stroke="#C77B9B" stroke-opacity="0.55">
  <circle r="14" stroke-dasharray="3 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#E5B5C7" stroke="none"/>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.222;1" dur="0.90s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.222;1" dur="0.90s" fill="freeze"/><text x="44" y="118" fill="#F8F0F3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Dependable backends. Security-minded software.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.462;1" dur="1.30s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.462;1" dur="1.30s" fill="freeze"/><text x="44" y="164" fill="#E5B5C7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">I&#x27;m a Python developer interested in dependable backend services, API development,</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.576;1" dur="1.65s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.576;1" dur="1.65s" fill="freeze"/><text x="44" y="192" fill="#E5B5C7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">web applications, and cybersecurity. I enjoy turning practical problems into working</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.650;1" dur="2.00s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.650;1" dur="2.00s" fill="freeze"/><text x="44" y="220" fill="#E5B5C7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">software and continuously improving my development skills.</text></g><rect x="549" y="204" width="9" height="20" fill="#E5B5C7"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>
