<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Education: B.Tech in Computer Science and Engineering, St. Mark Educational Institution Society Group of Institutions, affiliated with JNTU Anantapur. Graduated 2023, CGPA 6.67.">
<title>Education</title>
<defs>
  <linearGradient id="ed-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1d0c14"/><stop offset="0.6" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
  </linearGradient>
