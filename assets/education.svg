  <rect x="-300" y="0" width="300" height="230" fill="url(#ed-scan)">
    <animate attributeName="x" values="-300;1300" dur="9s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="1" y="1" width="1198" height="228" rx="18" fill="none" stroke="url(#ed-edge)" stroke-width="2.5"
