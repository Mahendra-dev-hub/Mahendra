<text x="60" y="49" fill="#C77B9B" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="3">02 / EDUCATION</text>
<rect x="238" y="43" width="852" height="2" fill="url(#ed-rule)">
