<svg xmlns="http://www.w3.org/2000/svg" width="560" height="88" viewBox="0 0 560 88" role="img" aria-labelledby="education-title education-desc">
  <title id="education-title">Education motif</title>
  <desc id="education-desc">A burgundy graduation cap above an open book, accented with a gentle moving highlight.</desc>
  <defs>
    <linearGradient id="education-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
      <animate attributeName="x1" values="0;.35;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#education-line)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="m72 31 42-18 42 18-42 18z"/>
    <path d="M85 37v16c17 12 31 12 58 0V37"/>
    <path d="M156 32v21"/>
    <circle cx="156" cy="56" r="2.5" fill="#C77B9B" stroke="none">
      <animate attributeName="opacity" values=".45;1;.45" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M80 71c12-7 24-7 34 0 10-7 22-7 34 0V55c-13-7-24-7-34 0-10-7-22-7-34 0z"/>
    <path d="M114 55v16"/>
    <path d="M191 44H448" stroke-opacity=".35"/>
    <path d="M191 44H307" stroke-width="3" stroke-dasharray="48 210">
      <animate attributeName="stroke-dashoffset" values="258;0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="466" cy="44" r="4" fill="#C77B9B">
    <animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
