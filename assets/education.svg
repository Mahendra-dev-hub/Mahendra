  </pattern>
  <clipPath id="ed-clip"><rect x="1" y="1" width="1198" height="228" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="228" rx="18" fill="url(#ed-bg)" stroke="#451126" stroke-width="2"/>
<g clip-path="url(#ed-clip)">
