<svg xmlns="http://www.w3.org/2000/svg" width="560" height="88" viewBox="0 0 560 88" role="img" aria-labelledby="experience-title experience-desc">
  <title id="experience-title">Professional experience motif</title>
  <desc id="experience-desc">A rose-accented career timeline with understated glowing milestones.</desc>
  <defs>
    <linearGradient id="experience-track" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
  </defs>
  <path d="M74 44H478" fill="none" stroke="url(#experience-track)" stroke-width="2" stroke-opacity=".55"/>
  <path d="M74 44H478" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-dasharray="34 370">
    <animate attributeName="stroke-dashoffset" values="404;0" dur="10s" repeatCount="indefinite"/>
  </path>
  <g fill="#F8F0F3" stroke="#701A3D" stroke-width="2">
    <circle cx="135" cy="44" r="9"/>
    <circle cx="276" cy="44" r="9"/>
    <circle cx="417" cy="44" r="9"/>
  </g>
  <g fill="#C77B9B">
    <circle cx="135" cy="44" r="4">
      <animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="276" cy="44" r="4">
      <animate attributeName="opacity" values=".4;1;.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="417" cy="44" r="4">
      <animate attributeName="r" values="3;5;3" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
