y="180" fill="#E5B5C7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Worked with a product used to scan systems and identify vulnerabilities across</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.632;1" dur="1.90s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.632;1" dur="1.90s" fill="freeze"/><text x="110" y="204" fill="#E5B5C7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Windows, Linux, and macOS environments; Nessus was among the tools used.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.667;1" dur="2.10s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.667;1" dur="2.10s" fill="freeze"/><text x="110" y="258" fill="#F8F0F3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">VAPT Intern</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.696;1" dur="2.30s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.696;1" dur="2.30s" fill="freeze"/><text x="110" y="288" fill="#C77B9B" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">Cartel Software Pvt. Ltd.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.720;1" dur="2.50s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.720;1" dur="2.50s" fill="freeze"/><rect x="330.0" y="270" width="207.7" height="28" rx="14.0" fill="#451126" fill-opacity="0.65" stroke="#C77B9B" stroke-opacity="0.4" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" begin="0.00s" repeatCount="indefinite"/></rect><text x="433.