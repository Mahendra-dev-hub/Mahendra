<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Experience. Technical Support Network L2 Intern at ConnectSecure: worked with a product used to scan systems and identify vulnerabilities across Windows, Linux and macOS environments; Nessus was among the tools used. VAPT Intern at Cartel Software Pvt. Ltd., May 2023 to October 2023.">
<title>Experience</title>
<defs>
  <linearGradient id="ex-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1d0c14"/><stop offset="0.6" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
  </linearGradient>
  <linearGradient id="ex-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D"/><stop offset="0.5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/>
  </linearGradient>
  <linearGradient id="ex-scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.09"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ex-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B" stop-opacity="0.8"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
  </linearGradient>
  <pattern id="ex-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.06" stroke-width="1"/>
  </pattern>
  <clipPath id="ex-clip"><rect x="1" y="1" width="1198" height="338" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="338" rx="18" fill="url(#ex-bg)" stroke="#451126" stroke-width="2"/>
<g clip-path="url(#ex-clip)">
  <rect x="1" y="1" width="1198" height="338" fill="url(#ex-grid)"/>
  <rect x="-300" y="0" width="300" height="340" fill="url(#ex-scan)">
    <animate attributeName="x" values="-300;1300" dur="9s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="url(#ex-edge)" stroke-width="2.5"
      pathLength="100" stroke-dasharray="14 86" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="8s" repeatCount="indefinite"/>
</rect>
<circle cx="44" cy="44" r="4" fill="#E5B5C7">
