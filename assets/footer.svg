<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Build with intent. Learn continuously. Keep shipping.">
  <defs>
    <linearGradient id="mb-foot-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#451126"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="mb-foot-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#mb-foot-bg)"/>
  <rect x="300" y="28" width="600" height="2" fill="url(#mb-foot-line)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="72" text-anchor="middle" fill="#F8F0F3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3">Build with intent  ·  Learn continuously  ·  Keep shipping</text>
  <circle cx="0" cy="100" r="3" fill="#E5B5C7">
    <animate attributeName="cx" values="0;1200" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
