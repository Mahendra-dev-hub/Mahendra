<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">Burgundy profile footer ornament</title>
  <desc id="footer-desc">A fine rose-colored line with a subtle moving highlight.</desc>
  <defs>
    <linearGradient id="footer-rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset=".28" stop-color="#701A3D" stop-opacity=".65"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset=".72" stop-color="#701A3D" stop-opacity=".65"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animate attributeName="x1" values="0;.18;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <path d="M24 36H1176" fill="none" stroke="url(#footer-rose)" stroke-width="1"/>
  <path d="M24 36H1176" fill="none" stroke="#E5B5C7" stroke-opacity=".8" stroke-width="1" stroke-dasharray="72 1080">
    <animate attributeName="stroke-dashoffset" values="1152;0" dur="12s" repeatCount="indefinite"/>
  </path>
  <circle cx="600" cy="36" r="3" fill="#C77B9B"/>
</svg>
