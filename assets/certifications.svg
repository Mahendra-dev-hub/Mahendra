<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="title desc">
<title id="title">Animated certifications illustration</title><desc id="desc">Animated CEH and Python credential accents.</desc>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190b12"/><stop offset="1" stop-color="#451126"/></linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701a3d"/><stop offset=".5" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8f0f3" stop-opacity="0"/><stop offset=".5" stop-color="#f8f0f3" stop-opacity=".20"/><stop offset="1" stop-color="#f8f0f3" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5b5c7" stroke-opacity=".075" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="150" rx="16" fill="#10070c"/>
<rect width="1000" height="150" rx="16" fill="url(#panel)" opacity=".86"/>
<rect width="1000" height="150" rx="16" fill="url(#grid)"/>
<rect x="-180" y="0" width="90" height="150" fill="url(#shine)"><animate attributeName="x" values="-180;1180" dur="8s" repeatCount="indefinite"/></rect>
<rect x="1" y="1" width="998" height="148" rx="15" fill="none" stroke="#c77b9b" stroke-opacity=".4"/>
<text x="35" y="34" font-family="monospace" font-size="10" letter-spacing="3" fill="#e5b5c7">06 / CERTIFICATIONS</text>
<g transform="translate(120 82)">
<circle r="38" fill="#190b12" stroke="#c77b9b" stroke-width="2"/>
<circle r="29" fill="none" stroke="#e5b5c7" stroke-opacity=".65" stroke-dasharray="3 5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
<text x="-20" y="6" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#f8f0f3">CEH</text>
</g>
<text x="190" y="76" font-family="Georgia,serif" font-size="23" fill="#f8f0f3">Ethical Hacking</text>
<text x="190" y="99" font-family="monospace" font-size="10" fill="#e5b5c7">VERIFY CREDENTIAL DETAILS BEFORE PUBLISHING</text>
<path d="M650 48V116" stroke="#701a3d" stroke-width="1"/>
<circle cx="720" cy="82" r="30" fill="#190b12" stroke="#c77b9b" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
<text x="707" y="89" font-family="Georgia,serif" font-size="20" fill="#e5b5c7">Py</text>
<text x="770" y="76" font-family="Georgia,serif" font-size="23" fill="#f8f0f3">Python</text>
<text x="770" y="99" font-family="monospace" font-size="10" fill="#e5b5c7">CERTIFICATION</text>
</svg>