<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="mb-hero-title mb-hero-desc">
  <title id="mb-hero-title">Mahendra Bandaru</title>
  <desc id="mb-hero-desc">Python Developer, Backend Development and Cybersecurity</desc>
  <defs>
    <linearGradient id="mb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
      <animate attributeName="x2" values="1;0.8;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="mb-glow" cx="0.82" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animate attributeName="cx" values="0.82;0.72;0.82" dur="9s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="mb-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mb-path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="mb-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="mb-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#mb-bg)"/>
  <rect width="1200" height="340" fill="url(#mb-grid)"/>
  <rect width="1200" height="340" fill="url(#mb-glow)"/>

  <!-- restrained orbital geometry -->
  <g transform="translate(980 170)" fill="none" stroke="#C77B9B" stroke-opacity="0.35">
    <circle r="70"/>
    <circle r="115" stroke-dasharray="3 9"/>
    <circle r="155" stroke-opacity="0.18"/>
    <g>
      <circle cx="115" cy="0" r="5" fill="#E5B5C7" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="-70" cy="0" r="3.5" fill="#C77B9B" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- drawn path -->
  <path d="M0 292 C 180 250, 300 310, 480 272 S 760 236, 900 262 S 1100 300, 1200 258"
        fill="none" stroke="url(#mb-path)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="1400" stroke-dashoffset="0" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="1400;0;0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#E5B5C7">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"
      path="M0 292 C 180 250, 300 310, 480 272 S 760 236, 900 262 S 1100 300, 1200 258"/>
  </circle>

  <!-- text -->
  <text x="70" y="62" fill="#C77B9B" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="3">&gt; PORTFOLIO / PROFILE</text>
  <text x="70" y="150" fill="#F8F0F3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="1">Mahendra Bandaru</text>
  <text x="72" y="196" fill="#E5B5C7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" letter-spacing="1.5">Python Developer  ·  Backend  ·  Cybersecurity</text>

  <!-- glowing underline -->
  <rect x="70" y="214" width="420" height="4" rx="2" fill="#E5B5C7" opacity="0.5" filter="url(#mb-soft)"/>
  <rect x="70" y="214" width="420" height="3" rx="1.5" fill="url(#mb-line)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="72" y="250" fill="#C77B9B" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" opacity="0.9">Building practical applications, API-driven services, and security-minded software.</text>
</svg>
