
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 1900" width="1248" height="1900" role="img" aria-label="Mahendra Bandaru profile">
  <title>Mahendra Bandaru — Python Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c050a"/>
      <stop offset="0.5" stop-color="#1b0a13"/>
      <stop offset="1" stop-color="#0c050a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#220d17"/>
      <stop offset="1" stop-color="#10070c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity=".09"/>
    </pattern>
    <style>
      .heading { font: 700 26px Arial, sans-serif; fill: #F8F0F3; }
      .body { font: 17px Arial, sans-serif; fill: #E5B5C7; }
      .muted { font: 14px Arial, sans-serif; fill: #C77B9B; }
      .title { font: 700 48px Arial, sans-serif; fill: #F8F0F3; }
      .card { fill: url(#card); stroke: #701A3D; stroke-width: 1.5; }
      .tag { fill: #451126; stroke: #C77B9B; stroke-opacity: .6; }
    </style>
  </defs>

  <rect width="1248" height="1900" rx="20" fill="url(#bg)"/>
  <rect width="1248" height="1900" fill="url(#grid)"/>

  <!-- HERO -->
  <g transform="translate(24 24)">
    <rect width="1200" height="270" rx="18" class="card"/>
    <rect width="1200" height="270" rx="18" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <text x="44" y="48" class="muted" letter-spacing="3">PORTFOLIO / PROFILE</text>
    <text x="44" y="112" class="title">Mahendra Bandaru</text>
    <text x="46" y="154" class="body">Python Developer · Backend · Cybersecurity</text>
    <rect x="46" y="177" width="410" height="3" rx="2" fill="url(#edge)"/>
    <text x="46" y="216" class="body">Building practical applications and security-minded software.</text>
    <circle cx="1080" cy="110" r="76" fill="none" stroke="#C77B9B" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="1080" cy="110" r="54" fill="none" stroke="#E5B5C7" stroke-opacity=".5" stroke-dasharray="4 9">
      <animateTransform attributeName="transform" type="rotate" from="0 1080 110" to="360 1080 110" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="110" r="8" fill="#E5B5C7">
      <animate attributeName="r" values="6;10;6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ABOUT -->
  <g transform="translate(24 318)">
    <rect width="1200" height="190" rx="18" class="card"/>
    <text x="36" y="45" class="muted" letter-spacing="2">01 / ABOUT ME</text>
    <text x="36" y="88" class="heading">Dependable backends. Security-minded software.</text>
    <text x="36" y="125" class="body">I enjoy developing Python applications, building APIs,</text>
    <text x="36" y="153" class="body">solving practical problems, and continuously improving my skills.</text>
  </g>

  <!-- EDUCATION -->
  <g transform="translate(24 532)">
    <rect width="1200" height="180" rx="18" class="card"/>
    <text x="36" y="45" class="muted" letter-spacing="2">02 / EDUCATION</text>
    <text x="36" y="87" class="heading">B.Tech — Computer Science and Engineering</text>
    <text x="36" y="119" class="body">St. Mark Educational Institution Society Group of Institutions</text>
    <text x="36" y="147" class="body">Affiliated with JNTU Anantapur · Graduated 2023</text>
    <text x="36" y="169" class="muted">CGPA: 6.67</text>
  </g>

  <!-- SKILLS -->
  <g transform="translate(24 736)">
    <rect width="1200" height="320" rx="18" class="card"/>
    <text x="36" y="45" class="muted" letter-spacing="2">03 / TECHNICAL SKILLS</text>
    <text x="36" y="88" class="heading">Languages and Backend</text>
    <g transform="translate(36 108)">
      <rect width="115" height="34" rx="17" class="tag"/>
      <text x="57" y="22" text-anchor="middle" class="body">Python</text>
      <rect x="128" width="90" height="34" rx="17" class="tag"/>
      <text x="173" y="22" text-anchor="middle" class="body">SQL</text>
      <rect x="231" width="120" height="34" rx="17" class="tag"/>
      <text x="291" y="22" text-anchor="middle" class="body">FastAPI</text>
      <rect x="364" width="120" height="34" rx="17" class="tag"/>
      <text x="424" y="22" text-anchor="middle" class="body">REST APIs</text>
    </g>
    <text x="36" y="190" class="heading">Frontend and Data</text>
    <g transform="translate(36 210)">
      <rect width="105" height="34" rx="17" class="tag"/>
      <text x="52" y="22" text-anchor="middle" class="body">React</text>
      <rect x="118" width="145" height="34" rx="17" class="tag"/>
      <text x="190" y="22" text-anchor="middle" class="body">SQLAlchemy</text>
      <rect x="276" width="105" height="34" rx="17" class="tag"/>
      <text x="328" y="22" text-anchor="middle" class="body">NumPy</text>
      <rect x="394" width="105" height="34" rx="17" class="tag"/>
      <text x="446" y="22" text-anchor="middle" class="body">Pandas</text>
      <rect x="512" width="105" height="34" rx="17" class="tag"/>
      <text x="564" y="22" text-anchor="middle" class="body">OpenCV</text>
    </g>
    <text x="36" y="285" class="heading">Security and Tools</text>
    <text x="350" y="285" class="body">Nmap · Burp Suite · Wireshark · Nessus · Git · GitHub</text>
  </g>

  <!-- PROJECTS -->
  <g transform="translate(24 1080)">
    <rect width="1200" height="370" rx="18" class="card"/>
    <text x="36" y="45" class="muted" letter-spacing="2">04 / PROJECTS</text>

    <!-- MOVIE WATCHLIST -->
    <g transform="translate(24 70)">
      <rect width="552" height="260" rx="14" fill="#10070C" stroke="#451126" stroke-width="1.5"/>
      <text x="24" y="42" class="heading">Movie Discovery &amp; Watchlist</text>
      <text x="24" y="80" class="body">Search and discover movies, then manage</text>
      <text x="24" y="108" class="body">a watchlist using genre and rating filters.</text>
      <g transform="translate(24 144)">
        <rect width="100" height="32" rx="16" class="tag"/>
        <text x="50" y="21" text-anchor="middle" class="body">Python</text>
        <rect x="112" width="105" height="32" rx="16" class="tag"/>
        <text x="164" y="21" text-anchor="middle" class="body">FastAPI</text>
        <rect x="229" width="95" height="32" rx="16" class="tag"/>
        <text x="276" y="21" text-anchor="middle" class="body">React</text>
        <rect x="24" y="44" width="145" height="32" rx="16" class="tag"/>
        <text x="96" y="65" text-anchor="middle" class="body">SQLAlchemy</text>
        <rect x="181" y="44" width="120" height="32" rx="16" class="tag"/>
        <text x="241" y="65" text-anchor="middle" class="body">TMDB API</text>
      </g>
    </g>

    <!-- WEATHER APPLICATION -->
    <g transform="translate(600 70)">
      <rect width="552" height="260" rx="14" fill="#10070C" stroke="#451126" stroke-width="1.5"/>
      <text x="24" y="42" class="heading">Weather Application</text>
      <text x="24" y="80" class="body">Retrieves location and forecast information</text>
      <text x="24" y="108" class="body">using the Open-Meteo weather API.</text>
      <g transform="translate(24 144)">
        <rect width="100" height="32" rx="16" class="tag"/>
        <text x="50" y="21" text-anchor="middle" class="body">Python</text>
        <rect x="112" width="105" height="32" rx="16" class="tag"/>
        <text x="164" y="21" text-anchor="middle" class="body">FastAPI</text>
        <rect x="229" width="155" height="32" rx="16" class="tag"/>
        <text x="306" y="21" text-anchor="middle" class="body">Open-Meteo API</text>
      </g>
    </g>
  </g>

  <!-- EXPERIENCE -->
  <g transform="translate(24 1474)">
    <rect width="1200" height="280" rx="18" class="card"/>
    <text x="36" y="45" class="muted" letter-spacing="2">05 / EXPERIENCE</text>
    <circle cx="48" cy="92" r="6" fill="#E5B5C7"/>
    <text x="72" y="99" class="heading">Technical Support Network L2 Intern</text>
    <text x="72" y="130" class="body">ConnectSecure</text>
    <text x="72" y="158" class="body">Worked with system vulnerability scanning across Windows, Linux,</text>
    <text x="72" y="184" class="body">and macOS environments; Nessus was among the tools used.</text>
    <circle cx="48" cy="222" r="6" fill="#E5B5C7"/>
    <text x="72" y="229" class="heading">VAPT Intern — Cartel Software Pvt. Ltd.</text>
    <text x="72" y="256" class="body">May 2023 – October 2023</text>
  </g>

  <!-- FOOTER -->
  <g transform="translate(24 1770)">
    <rect width="1200" height="90" rx="18" class="card"/>
    <text x="36" y="38" class="muted" letter-spacing="2">BUILD WITH INTENT</text>
    <text x="36" y="66" class="body">Learn continuously. Keep shipping.</text>
    <path d="M850 45h270" stroke="url(#edge)" stroke-width="2"/>
    <circle cx="1120" cy="45" r="5" fill="#E5B5C7">
      <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
