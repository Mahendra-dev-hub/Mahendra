<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="title desc">
<title id="title">Animated technical skills illustration</title><desc id="desc">Animated network nodes and skill progress lines.</desc>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190b12"/><stop offset="1" stop-color="#451126"/></linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701a3d"/><stop offset=".5" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8f0f3" stop-opacity="0"/><stop offset=".5" stop-color="#f8f0f3" stop-opacity=".20"/><stop offset="1" stop-color="#f8f0f3" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5b5c7" stroke-opacity=".075" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="150" rx="16" fill="#10070c"/>
<rect width="1000" height="150" rx="16" fill="url(#panel)" opacity=".86"/>
<rect width="1000" height="150" rx="16" fill="url(#grid)"/>
<rect x="-180" y="0" width="90" height="150" fill="url(#shine)"><animate attributeName="x" values="-180;1180" dur="8s" repeatCount="indefinite"/></rect>
<rect x="1" y="1" width="998" height="148" rx="15" fill="none" stroke="#c77b9b" stroke-opacity=".4"/>
<text x="35" y="34" font-family="monospace" font-size="10" letter-spacing="3" fill="#e5b5c7">03 / TECHNICAL SKILLS</text>
<g stroke="#c77b9b" stroke-width="2" fill="#190b12">
<path d="M115 77L165 48 215 77 165 106Z" fill="none"/>
<path d="M115 77H215M165 48V106" stroke-opacity=".6"/>
<circle cx="115" cy="77" r="7"/><circle cx="165" cy="48" r="7"/><circle cx="215" cy="77" r="7"/><circle cx="165" cy="106" r="7"/>
<circle cx="115" cy="77" r="7" fill="#e5b5c7"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle>
</g>
<g stroke="#451126" stroke-width="5" stroke-linecap="round"><path d="M300 52H690"/><path d="M300 78H690"/><path d="M300 104H690"/></g>
<g stroke="url(#rose)" stroke-width="5" stroke-linecap="round"><path d="M300 52H530"><animate attributeName="stroke-dasharray" values="0 390;230 390;0 390" dur="4s" repeatCount="indefinite"/></path><path d="M300 78H620"><animate attributeName="stroke-dasharray" values="0 390;320 390;0 390" dur="5s" repeatCount="indefinite"/></path><path d="M300 104H455"><animate attributeName="stroke-dasharray" values="0 390;155 390;0 390" dur="3.5s" repeatCount="indefinite"/></path></g>
<text x="750" y="57" font-family="monospace" font-size="10" fill="#e5b5c7">PYTHON</text><text x="750" y="83" font-family="monospace" font-size="10" fill="#e5b5c7">BACKEND</text><text x="750" y="109" font-family="monospace" font-size="10" fill="#e5b5c7">SECURITY</text>
</svg>