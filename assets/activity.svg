<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Activity: GitHub contribution heatmap">
<title>Activity</title>
<defs>
  <linearGradient id="ac-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1d0c14"/><stop offset="0.6" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
  </linearGradient>
  <linearGradient id="ac-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D"/><stop offset="0.5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/>
  </linearGradient>
  <linearGradient id="ac-scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.09"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ac-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B" stop-opacity="0.8"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
  </linearGradient>
  <pattern id="ac-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.06" stroke-width="1"/>
  </pattern>
  <clipPath id="ac-clip"><rect x="1" y="1" width="1198" height="138" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="138" rx="18" fill="url(#ac-bg)" stroke="#451126" stroke-width="2"/>
<g clip-path="url(#ac-clip)">
  <rect x="1" y="1" width="1198" height="138" fill="url(#ac-grid)"/>
  <rect x="-300" y="0" width="300" height="140" fill="url(#ac-scan)">
    <animate attributeName="x" values="-300;1300" dur="9s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="1" y="1" width="1198" height="138" rx="18" fill="none" stroke="url(#ac-edge)" stroke-width="2.5"
      pathLength="100" stroke-dasharray="14 86" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="8s" repeatCount="indefinite"/>
</rect>
<circle cx="44" cy="44" r="4" fill="#E5B5C7">
  <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/>
</circle>
<text x="60" y="49" fill="#C77B9B" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="3">06 / ACTIVITY</text>
<rect x="226" y="43" width="864" height="2" fill="url(#ac-rule)">
  <animate attributeName="opacity" values="0.35;1;0.35" dur="5s" repeatCount="indefinite"/>
</rect>
<g transform="translate(1136 44)" fill="none" stroke="#C77B9B" stroke-opacity="0.55">
  <circle r="14" stroke-dasharray="3 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#E5B5C7" stroke="none"/>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.222;1" dur="0.90s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.222;1" dur="0.90s" fill="freeze"/><text x="44" y="108" fill="#F8F0F3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">GitHub contribution heatmap</text></g><rect x="940" y="82" width="12" height="30" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="30;10;30" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="82;102;82" dur="2.2s" repeatCount="indefinite"/></rect><rect x="960" y="60" width="12" height="52" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="52;28;52" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="60;84;60" dur="2.6s" repeatCount="indefinite"/></rect><rect x="980" y="90" width="12" height="22" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="22;10;22" dur="3.0s" repeatCount="indefinite"/><animate attributeName="y" values="90;102;90" dur="3.0s" repeatCount="indefinite"/></rect><rect x="1000" y="52" width="12" height="60" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="60;36;60" dur="3.4s" repeatCount="indefinite"/><animate attributeName="y" values="52;76;52" dur="3.4s" repeatCount="indefinite"/></rect><rect x="1020" y="72" width="12" height="40" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="40;16;40" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="72;96;72" dur="2.2s" repeatCount="indefinite"/></rect><rect x="1040" y="46" width="12" height="66" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="66;42;66" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="46;70;46" dur="2.6s" repeatCount="indefinite"/></rect><rect x="1060" y="84" width="12" height="28" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="28;10;28" dur="3.0s" repeatCount="indefinite"/><animate attributeName="y" values="84;102;84" dur="3.0s" repeatCount="indefinite"/></rect><rect x="1080" y="64" width="12" height="48" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="48;24;48" dur="3.4s" repeatCount="indefinite"/><animate attributeName="y" values="64;88;64" dur="3.4s" repeatCount="indefinite"/></rect><rect x="1100" y="78" width="12" height="34" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="34;10;34" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="78;102;78" dur="2.2s" repeatCount="indefinite"/></rect><rect x="1120" y="56" width="12" height="56" rx="3" fill="#C77B9B" fill-opacity="0.75"><animate attributeName="height" values="56;32;56" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="56;80;56" dur="2.6s" repeatCount="indefinite"/></rect>
</svg>
