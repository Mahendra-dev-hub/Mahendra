<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Connect: github.com/Mahendra-dev-hub">
<title>Connect</title>
<defs>
  <linearGradient id="cn-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1d0c14"/><stop offset="0.6" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
  </linearGradient>
  <linearGradient id="cn-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D"/><stop offset="0.5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/>
  </linearGradient>
  <linearGradient id="cn-scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.09"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cn-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B" stop-opacity="0.8"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
  </linearGradient>
  <pattern id="cn-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.06" stroke-width="1"/>
  </pattern>
  <clipPath id="cn-clip"><rect x="1" y="1" width="1198" height="168" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="168" rx="18" fill="url(#cn-bg)" stroke="#451126" stroke-width="2"/>
<g clip-path="url(#cn-clip)">
  <rect x="1" y="1" width="1198" height="168" fill="url(#cn-grid)"/>
  <rect x="-300" y="0" width="300" height="170" fill="url(#cn-scan)">
    <animate attributeName="x" values="-300;1300" dur="9s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="1" y="1" width="1198" height="168" rx="18" fill="none" stroke="url(#cn-edge)" stroke-width="2.5"
      pathLength="100" stroke-dasharray="14 86" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="8s" repeatCount="indefinite"/>
</rect>
<circle cx="44" cy="44" r="4" fill="#E5B5C7">
  <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/>
</circle>
<text x="60" y="49" fill="#C77B9B" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="3">07 / CONNECT</text>
<rect x="215" y="43" width="875" height="2" fill="url(#cn-rule)">
  <animate attributeName="opacity" values="0.35;1;0.35" dur="5s" repeatCount="indefinite"/>
</rect>
<g transform="translate(1136 44)" fill="none" stroke="#C77B9B" stroke-opacity="0.55">
  <circle r="14" stroke-dasharray="3 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#E5B5C7" stroke="none"/>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.222;1" dur="0.90s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.222;1" dur="0.90s" fill="freeze"/><text x="44" y="112" fill="#F8F0F3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">github.com/Mahendra-dev-hub</text></g><rect x="44" y="128" width="520" height="3" rx="1.5" fill="#E5B5C7" opacity="0.8"><animate attributeName="width" values="40;520;520;40" keyTimes="0;0.5;0.85;1" dur="6s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.462;1" dur="1.30s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.462;1" dur="1.30s" fill="freeze"/><text x="44" y="152" fill="#C77B9B" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Open to opportunities in backend development and application security.</text></g>
</svg>
