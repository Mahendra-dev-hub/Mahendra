<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="dark-title dark-desc">
  <title id="dark-title">Mahendra Bandaru — Python Developer</title>
  <desc id="dark-desc">A burgundy editorial profile banner for Python development, backend engineering, and cybersecurity.</desc>
  <defs>
    <linearGradient id="dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset=".58" stop-color="#190B12"/>
      <stop offset="1" stop-color="#30101D"/>
      <animate attributeName="x1" values="0;0.14;0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="dark-rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset=".52" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B"/>
      <animate attributeName="x2" values="1;.78;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="dark-glow">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".55"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dark-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E5B5C7" stroke-opacity=".075"/>
    </pattern>
    <filter id="dark-soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="dark-frame">
      <rect x="8" y="8" width="1184" height="364" rx="22"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="1184" height="364" rx="22" fill="#10070C"/>
  <g clip-path="url(#dark-frame)">
    <rect width="1200" height="380" fill="url(#dark-bg)"/>
    <rect x="8" y="8" width="1184" height="364" fill="url(#dark-grid)"/>
    <ellipse cx="990" cy="180" rx="270" ry="220" fill="url(#dark-glow)">
      <animate attributeName="cx" values="970;1030;970" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <text x="76" y="85" fill="#C77B9B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="4">ENGINEERING / 01</text>
    <text x="72" y="171" fill="#F8F0F3" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" letter-spacing="-.8">Mahendra Bandaru</text>
    <text x="78" y="215" fill="#E5B5C7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="1.1">PYTHON DEVELOPER  /  BACKEND DEVELOPER  /  CYBERSECURITY ENTHUSIAST</text>
    <path d="M78 244H720" fill="none" stroke="url(#dark-rose)" stroke-width="2" stroke-linecap="round" filter="url(#dark-soft-glow)"/>
    <path d="M78 244H720" fill="none" stroke="#E5B5C7" stroke-opacity=".65" stroke-width="1" stroke-dasharray="84 558">
      <animate attributeName="stroke-dashoffset" values="642;0" dur="7s" repeatCount="indefinite"/>
    </path>
    <text x="78" y="286" fill="#C77B9B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="1">PYTHON  ·  FASTAPI  ·  APPLICATION SECURITY</text>

    <g transform="translate(958 184)" fill="none" stroke="#C77B9B">
      <circle r="108" stroke-opacity=".23"/>
      <circle r="76" stroke-opacity=".4" stroke-dasharray="2 9"/>
      <ellipse rx="108" ry="40" stroke="#E5B5C7" stroke-opacity=".55" transform="rotate(-35)">
        <animateTransform attributeName="transform" type="rotate" from="-35" to="325" dur="42s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="0" cy="-108" r="4" fill="#E5B5C7" stroke="none"/>
      <circle cx="76" cy="0" r="3" fill="#C77B9B" stroke="none"/>
      <path d="M-8 0h16M0-8v16" stroke="#F8F0F3" stroke-opacity=".8"/>
    </g>

    <text x="1120" y="337" text-anchor="end" fill="#C77B9B" fill-opacity=".8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">BUILD WITH INTENT</text>
  </g>
  <rect x="8" y="8" width="1184" height="364" rx="22" fill="none" stroke="#C77B9B" stroke-opacity=".42"/>
</svg>
