<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Bandaru Mahendra — Software Engineer and AI Engineer</title>
  <desc id="desc">Premium terminal-inspired GitHub profile banner for Bandaru Mahendra, focused on Python, FastAPI, AI and cybersecurity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset=".48" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#F5F7FB"/>
      <animate attributeName="x1" values="0;0.15;0" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset=".48" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#059669"/>
      <animate attributeName="x2" values="1;.8;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#0891B2" stop-opacity=".75"/>
      <stop offset="1" stop-color="#059669" stop-opacity=".0"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".26"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#0891B2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748B" stroke-opacity=".055"/>
    </pattern>
    <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#fff" stroke-opacity=".018"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="8" y="8" width="1164" height="594" rx="24"/></clipPath>
    <clipPath id="leftClip"><rect x="32" y="74" width="406" height="500" rx="18"/></clipPath>
  </defs>

  <rect x="8" y="8" width="1164" height="594" rx="24" fill="#0F172A"/>
  <g clip-path="url(#frame)">
    <rect width="1180" height="610" fill="url(#bg)"/>
    <circle cx="80" cy="110" r="300" fill="url(#glowV)">
      <animate attributeName="cx" values="80;150;80" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="500" r="330" fill="url(#glowC)">
      <animate attributeName="cy" values="500;440;500" dur="21s" repeatCount="indefinite"/>
    </circle>
    <rect x="8" y="8" width="1164" height="594" fill="url(#grid)"/>
    <rect x="8" y="8" width="1164" height="594" fill="url(#scan)"/>

    <!-- ambient particles -->
    <g fill="#0891B2">
      <circle cx="470" cy="126" r="1.5" opacity=".55"><animate attributeName="cy" values="126;116;126" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="154" r="1.2" opacity=".4"><animate attributeName="cy" values="154;164;154" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="555" r="1.4" opacity=".45"><animate attributeName="cx" values="980;990;980" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="458" cy="534" r="1.1" opacity=".35"><animate attributeName="cy" values="534;526;534" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- top terminal chrome -->
    <rect x="8" y="8" width="1164" height="48" fill="#0F172A" fill-opacity=".84"/>
    <path d="M8 56H1172" stroke="#CBD5E1" stroke-opacity=".55"/>
    <g>
      <circle cx="32" cy="32" r="6" fill="#F43F5E"/>
      <circle cx="52" cy="32" r="6" fill="#D97706"/>
      <circle cx="72" cy="32" r="6" fill="#10B981"/>
    </g>
    <text x="102" y="37" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">mahendra@profile:~</text>
    <text x="1078" y="37" text-anchor="end" fill="#10B981" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="1.5">● ONLINE</text>

    <!-- left visual map -->
    <rect x="32" y="74" width="406" height="500" rx="18" fill="#FFFFFF" fill-opacity=".58" stroke="#CBD5E1" stroke-opacity=".7" filter="url(#shadow)"/>
    <text x="54" y="105" fill="#0891B2" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="2">VISUAL.MAP</text>
    <text x="54" y="126" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">identity.render / terminal-mode</text>

    <!-- dot matrix identity -->
    <g transform="translate(93 154)" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="9">
      <rect x="-12" y="-18" width="286" height="226" rx="14" fill="#0F172A" fill-opacity=".72" stroke="#0891B2" stroke-opacity=".12"/>
      <g fill="url(#accent)" opacity=".92">
        <text x="12" y="20">███    ███</text>
        <text x="12" y="30">████  ████</text>
        <text x="12" y="40">██ ████ ██</text>
        <text x="12" y="50">██  ██  ██</text>
        <text x="12" y="60">██      ██</text>
        <text x="12" y="70">██ ████ ██</text>
        <text x="12" y="80">██  ██  ██</text>
        <text x="12" y="90">██      ██</text>
        <text x="12" y="100">██      ██</text>
        <text x="12" y="110">██      ██</text>
      </g>
      <g fill="#1E293B" opacity=".72">
        <text x="38" y="142" font-size="34" letter-spacing="-4">BM</text>
      </g>
      <path d="M18 164H250" stroke="url(#line)"/>
      <text x="18" y="184" fill="#64748B" font-size="9">DOT-MATRIX / ENGINEERING ID</text>
    </g>

    <text x="235" y="386" text-anchor="middle" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="23" font-weight="700">BANDARU MAHENDRA</text>
    <text x="235" y="412" text-anchor="middle" fill="#6D28D9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="1.2">SOFTWARE ENGINEER · AI ENGINEER</text>
    <text x="235" y="437" text-anchor="middle" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">Python · FastAPI · AI/ML · Cybersecurity</text>

    <rect x="62" y="466" width="346" height="1" fill="url(#line)"/>
    <text x="62" y="492" fill="#0891B2" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">$</text>
    <text x="76" y="492" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">build --ship --learn</text>
    <text x="62" y="517" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">focus: intelligent systems + secure software</text>
    <text x="62" y="542" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">location: Hyderabad, India</text>

    <!-- right system info -->
    <rect x="462" y="74" width="686" height="500" rx="18" fill="#FFFFFF" fill-opacity=".48" stroke="#CBD5E1" stroke-opacity=".7" filter="url(#shadow)"/>
    <text x="490" y="105" fill="#0891B2" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="2">SYSTEM.INFO</text>
    <text x="490" y="126" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">./profile.sh --verbose</text>
    <circle cx="1118" cy="105" r="4" fill="#10B981"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle>

    <!-- hero identity -->
    <text x="490" y="166" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="31" font-weight="700">BANDARU MAHENDRA</text>
    <text x="490" y="193" fill="#6D28D9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13">Software Engineer · AI Engineer</text>
    <text x="490" y="216" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">Building practical backend, AI and security-focused systems.</text>

    <rect x="490" y="238" width="630" height="1" fill="#334155" opacity=".8"/>

    <!-- info rows -->
