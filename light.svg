      <text x="490" y="264" fill="#64748B">NAME</text><text x="620" y="264" fill="#1E293B">Bandaru Mahendra</text>
      <text x="490" y="290" fill="#64748B">ROLE</text><text x="620" y="290" fill="#1E293B">Software Engineer / AI Engineer</text>
      <text x="490" y="316" fill="#64748B">LOCATION</text><text x="620" y="316" fill="#1E293B">Hyderabad, India</text>
      <text x="490" y="342" fill="#64748B">EDUCATION</text><text x="620" y="342" fill="#1E293B">B.Tech · Computer Science &amp; Engineering</text>
      <text x="490" y="368" fill="#64748B">FOCUS</text><text x="620" y="368" fill="#1E293B">Backend · AI/ML · Cybersecurity · Automation</text>
    </g>

    <rect x="490" y="391" width="630" height="1" fill="#334155" opacity=".8"/>
    <text x="490" y="417" fill="#0891B2" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10" letter-spacing="1.6">STACK.SNAPSHOT</text>

    <!-- tech pills -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">
      <g transform="translate(490 433)">
        <rect width="88" height="27" rx="13" fill="#7C3AED" fill-opacity=".13" stroke="#7C3AED" stroke-opacity=".55"/>
        <circle cx="14" cy="13.5" r="3" fill="#7C3AED"/><text x="25" y="17" fill="#5B21B6">Python</text>
      </g>
      <g transform="translate(587 433)">
        <rect width="98" height="27" rx="13" fill="#0891B2" fill-opacity=".10" stroke="#0891B2" stroke-opacity=".5"/>
        <circle cx="14" cy="13.5" r="3" fill="#0891B2"/><text x="25" y="17" fill="#155E75">FastAPI</text>
      </g>
      <g transform="translate(694 433)">
        <rect width="84" height="27" rx="13" fill="#059669" fill-opacity=".10" stroke="#10B981" stroke-opacity=".5"/>
        <circle cx="14" cy="13.5" r="3" fill="#10B981"/><text x="25" y="17" fill="#065F46">React</text>
      </g>
      <g transform="translate(787 433)">
        <rect width="86" height="27" rx="13" fill="#7C3AED" fill-opacity=".13" stroke="#7C3AED" stroke-opacity=".55"/>
        <circle cx="14" cy="13.5" r="3" fill="#7C3AED"/><text x="25" y="17" fill="#5B21B6">AI / ML</text>
      </g>
      <g transform="translate(882 433)">
        <rect width="100" height="27" rx="13" fill="#0891B2" fill-opacity=".10" stroke="#0891B2" stroke-opacity=".5"/>
        <circle cx="14" cy="13.5" r="3" fill="#0891B2"/><text x="25" y="17" fill="#155E75">OpenCV</text>
      </g>
      <g transform="translate(991 433)">
        <rect width="96" height="27" rx="13" fill="#059669" fill-opacity=".10" stroke="#10B981" stroke-opacity=".5"/>
        <circle cx="14" cy="13.5" r="3" fill="#10B981"/><text x="25" y="17" fill="#065F46">Security</text>
      </g>
    </g>

    <text x="490" y="491" fill="#0891B2" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10" letter-spacing="1.6">SELECTED.PROOF</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">
      <text x="490" y="515" fill="#334155">01</text><text x="520" y="515" fill="#0F172A">AI Resume Tailoring Platform</text>
      <text x="490" y="538" fill="#334155">02</text><text x="520" y="538" fill="#0F172A">Image &amp; Text Plagiarism Detection</text>
      <text x="812" y="515" fill="#334155">03</text><text x="842" y="515" fill="#0F172A">Weather Application</text>
      <text x="812" y="538" fill="#334155">04</text><text x="842" y="538" fill="#0F172A">Telegram Trading Signal Automation</text>
    </g>

    <rect x="490" y="552" width="630" height="1" fill="url(#line)"/>
    <text x="490" y="566" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="9">CONNECT  /  github.com/Mahendra-dev-hub  /  linkedin.com/in/mahendra-bhandaru</text>
  </g>
  <rect x="8" y="8" width="1164" height="594" rx="24" fill="none" stroke="#475569" stroke-opacity=".75"/>
</svg>