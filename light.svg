<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="light-title light-desc">
  <title id="light-title">Mahendra Bandaru — Python Developer</title>
  <desc id="light-desc">A burgundy editorial profile banner for Python development, backend engineering, and cybersecurity.</desc>
  <defs>
    <linearGradient id="light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset=".58" stop-color="#F3E5EB"/>
      <stop offset="1" stop-color="#E5B5C7"/>
      <animate attributeName="x1" values="0;0.14;0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="light-rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126"/>
      <stop offset=".52" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#C77B9B"/>
      <animate attributeName="x2" values="1;.78;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="light-glow">
      <stop offset="0" stop-color="#C77B9B" stop-opacity=".28"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="light-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#451126" stroke-opacity=".08"/>
    </pattern>
    <filter id="light-soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="light-frame">
      <rect x="8" y="8" width="1184" height="364" rx="22"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="1184" height="364" rx="22" fill="#F8F0F3"/>
  <g clip-path="url(#light-frame)">
    <rect width="1200" height="380" fill="url(#light-bg)"/>
    <rect x="8" y="8" width="1184" height="364" fill="url(#light-grid)"/>
    <ellipse cx="990" cy="180" rx="270" ry="220" fill="url(#light-glow)">
      <animate attributeName="cx" values="970;1030;970" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <text x="76" y="85" fill="#701A3D" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="4">ENGINEERING / 01</text>
    <text x="72" y="171" fill="#190B12" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" letter-spacing="-.8">Mahendra Bandaru</text>
    <text x="78" y="215" fill="#451126" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="1.1">PYTHON DEVELOPER  /  BACKEND DEVELOPMENT  /  CYBERSECURITY</text>
    <path d="M78 244H720" fill="none" stroke="url(#light-rose)" stroke-width="2" stroke-linecap="round" filter="url(#light-soft-glow)"/>
    <path d="M78 244H720" fill="none" stroke="#701A3D" stroke-opacity=".65" stroke-width="1" stroke-dasharray="84 558">
      <animate attributeName="stroke-dashoffset" values="642;0" dur="7s" repeatCount="indefinite"/>
    </path>
    <text x="78" y="286" fill="#701A3D" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="1">PYTHON  ·  FASTAPI  ·  APPLICATION SECURITY</text>

    <g transform="translate(958 184)" fill="none" stroke="#701A3D">
      <circle r="108" stroke-opacity=".22"/>
      <circle r="76" stroke-opacity=".36" stroke-dasharray="2 9"/>
      <ellipse rx="108" ry="40" stroke="#451126" stroke-opacity=".5" transform="rotate(-35)">
        <animateTransform attributeName="transform" type="rotate" from="-35" to="325" dur="42s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="0" cy="-108" r="4" fill="#451126" stroke="none"/>
      <circle cx="76" cy="0" r="3" fill="#701A3D" stroke="none"/>
      <path d="M-8 0h16M0-8v16" stroke="#190B12" stroke-opacity=".8"/>
    </g>

    <text x="1120" y="337" text-anchor="end" fill="#701A3D" fill-opacity=".85" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">BUILD WITH INTENT</text>
  </g>
  <rect x="8" y="8" width="1184" height="364" rx="22" fill="none" stroke="#701A3D" stroke-opacity=".42"/>
</svg>
